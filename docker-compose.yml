# Rettungswache-Wachbuch – Docker Compose
#
# Endnutzer: install.sh legt diese Datei als compose.yml in den Zielordner und
# erzeugt .env (docs/DEPLOYMENT.md). Die Dienste nutzen vorgefertigte Images
# aus ghcr.io; WACHBUCH_VERSION wählt die Version (Standard latest).
# Entwickler bauen lokal:
#   docker compose -f docker-compose.yml -f compose.build.yml up -d --build
# Optionaler TLS-Proxy (Caddy): Profil "https" (COMPOSE_PROFILES=https).
# Optionaler Signal-Versand: Profil "signal" (docs/SIGNAL.md).

name: rettungswache-wachbuch

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  db:
    # PostgreSQL 17 mit eingebautem Rollen-Init (scripts/init-db.sh) und
    # config/postgresql.conf (Dockerfile.backup, Ziel "db"). Damit braucht
    # niemand einen Git-Checkout für Bind-Mounts.
    image: ${WACHBUCH_REGISTRY:-ghcr.io/katschko-it}/rettungswache-wachbuch-db:${WACHBUCH_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    # The official image reads its configuration from $PGDATA/postgresql.conf,
    # NOT from /etc/postgresql. Without this explicit config_file the file
    # baked into the image is silently ignored.
    # Speicherwerte: kleine Standardwerte für 1-2-GB-Systeme, per .env anhebbar
    # (siehe config/postgresql.conf und docs/OPERATIONS.md).
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-512MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
    # Docker gibt Containern standardmäßig nur 64 MB /dev/shm; PostgreSQL legt
    # dort Shared Memory für parallele Abfragen ab.
    shm_size: ${POSTGRES_SHM_SIZE:-256mb}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      FEED_DB_USER: ${FEED_DB_USER}
      FEED_DB_PASSWORD: ${FEED_DB_PASSWORD}
      BACKUP_DB_USER: ${BACKUP_DB_USER}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD}
      PUSH_DB_USER: ${PUSH_DB_USER:-rwsth_push}
      PUSH_DB_PASSWORD: ${PUSH_DB_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-db
      - worker-db
      - backup-db
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.8.3-alpine@sha256:dc95ea2fcf5d5c4253be0f967c28143d0f625846197eed2fd32c748eb99abfca
    restart: unless-stopped
    logging: *default-logging
    # Redis is an expendable cache only. Sessions remain durable in PostgreSQL
    # via Django cached_db; do not persist a second copy of cache/session data.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - app-db
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  migrate:
    image: ${WACHBUCH_REGISTRY:-ghcr.io/katschko-it}/rettungswache-wachbuch:${WACHBUCH_VERSION:-latest}
    command: ["/app/scripts/migrate.sh"]
    restart: "no"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      CRYPTO_MASTER_KEY: ${CRYPTO_MASTER_KEY:-}
      CRYPTO_PREVIOUS_MASTER_KEY: ${CRYPTO_PREVIOUS_MASTER_KEY:-}
      DJANGO_DEBUG: "false"
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      FEED_DB_USER: ${FEED_DB_USER}
      FEED_DB_PASSWORD: ${FEED_DB_PASSWORD}
      BACKUP_DB_USER: ${BACKUP_DB_USER}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD}
      PUSH_DB_USER: ${PUSH_DB_USER:-rwsth_push}
      PUSH_DB_PASSWORD: ${PUSH_DB_PASSWORD:-}
      DEFAULT_STATION_NAME: ${DEFAULT_STATION_NAME:-Rettungswache}
      DEFAULT_STATION_SLUG: ${DEFAULT_STATION_SLUG:-rettungswache}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_SANDBOX: ${DEMO_SANDBOX:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo-Passwort-12345}
      MFA_ENABLED: ${MFA_ENABLED:-true}
      MFA_REQUIRED: ${MFA_REQUIRED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-db
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    image: ${WACHBUCH_REGISTRY:-ghcr.io/katschko-it}/rettungswache-wachbuch:${WACHBUCH_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      CRYPTO_MASTER_KEY: ${CRYPTO_MASTER_KEY:-}
      CRYPTO_PREVIOUS_MASTER_KEY: ${CRYPTO_PREVIOUS_MASTER_KEY:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      # Explicit opt-in; never pass the insecure QR test override to this service.
      SETUP_BOOTSTRAP_TOKEN: ${SETUP_BOOTSTRAP_TOKEN:-}
      QR_LOGIN_ENABLED: ${QR_LOGIN_ENABLED:-false}
      QR_LOGIN_TTL_SECONDS: ${QR_LOGIN_TTL_SECONDS:-120}
      SITE_URL: ${SITE_URL:-}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-false}
      DB_HOST: db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8090}
      DEFAULT_STATION_NAME: ${DEFAULT_STATION_NAME:-Rettungswache}
      DEFAULT_STATION_SLUG: ${DEFAULT_STATION_SLUG:-rettungswache}
      APP_NAME: ${APP_NAME:-Wachwerk}
      SOURCE_URL: ${SOURCE_URL:-https://github.com/Katschko-IT/Rettungswache-Wachbuch}
      FEED_ALLOWED_HOSTS: ${FEED_ALLOWED_HOSTS:-}
      RETENTION_FEED_DAYS: ${RETENTION_FEED_DAYS:-90}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-0}
      MFA_ENABLED: ${MFA_ENABLED:-true}
      MFA_REQUIRED: ${MFA_REQUIRED:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo-Passwort-12345}
      # Öffentliche Demo mit eigener Demo-Wache je Besuch (docs/DEMO.md)
      DEMO_SANDBOX: ${DEMO_SANDBOX:-false}
      DEMO_SANDBOX_IDLE_MINUTES: ${DEMO_SANDBOX_IDLE_MINUTES:-30}
      DEMO_SANDBOX_MAX_MINUTES: ${DEMO_SANDBOX_MAX_MINUTES:-120}
      DEMO_SANDBOX_MAX_ACTIVE: ${DEMO_SANDBOX_MAX_ACTIVE:-100}
      DEMO_SANDBOX_PER_IP_HOUR: ${DEMO_SANDBOX_PER_IP_HOUR:-10}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      REGISTRATION_RATE_LIMIT: ${REGISTRATION_RATE_LIMIT:-5}
      WEBAUTHN_ENABLED: ${WEBAUTHN_ENABLED:-true}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_ADMIN_EMAIL: ${VAPID_ADMIN_EMAIL:-ops@localhost}
      PUSH_ALLOWED_ENDPOINT_HOSTS: ${PUSH_ALLOWED_ENDPOINT_HOSTS:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RATELIMIT_KEY_SALT: ${RATELIMIT_KEY_SALT:-wachbuch}
      ERROR_EVENT_RETENTION_DAYS: ${ERROR_EVENT_RETENTION_DAYS:-30}
      ERROR_EVENT_EXPORT_LIMIT: ${ERROR_EVENT_EXPORT_LIMIT:-200}
      # Ohne Wert: nur durchreichen, wenn in .env gesetzt (sonst gilt die
      # Version aus core/version.py; ein leerer Wert würde sie verdecken).
      APP_VERSION:
      # Gunicorn (config/gunicorn.py); für mehr Last Worker erhöhen und
      # POSTGRES_MAX_CONNECTIONS mitziehen.
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
      # Wachenterminal und lokales Zertifikat (docs/PI-WACHENTERMINAL.md)
      TERMINAL_ENABLED: ${TERMINAL_ENABLED:-false}
      TERMINAL_IDLE_SECONDS: ${TERMINAL_IDLE_SECONDS:-120}
      LOCAL_TLS_CERT_SHA256: ${LOCAL_TLS_CERT_SHA256:-}
      TERMINAL_WIFI_SSID: ${TERMINAL_WIFI_SSID:-}
      TERMINAL_WIFI_PASSWORD: ${TERMINAL_WIFI_PASSWORD:-}
      # E-Mail (optional, SMTP): Kaffeekassen-Erinnerung, Test-E-Mail.
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      # Signal (Profil "signal"): Kopplung und Gruppenwahl in der Weboberfläche.
      SIGNAL_API_URL: ${SIGNAL_API_URL:-}
      SIGNAL_NUMBER: ${SIGNAL_NUMBER:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8090}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/healthz/', headers={'Host': 'localhost'}), timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-db
      - web-ingress
      - signal-api
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  feed-worker:
    image: ${WACHBUCH_REGISTRY:-ghcr.io/katschko-it}/rettungswache-wachbuch:${WACHBUCH_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    command: ["/app/scripts/start-worker.sh"]
    # Kein HTTP-Listener: Statt des Gunicorn-Checks aus dem Image prüft der
    # Healthcheck das Lebenszeichen, das sync_feeds jede Minute schreibt.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/feed_worker.alive') < 180 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      FEED_HEARTBEAT_FILE: /tmp/feed_worker.alive
      DJANGO_SECRET_KEY: ${FEED_WORKER_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${FEED_DB_USER}
      DB_PASSWORD: ${FEED_DB_PASSWORD}
      ALLOWED_HOSTS: localhost
      FEED_ALLOWED_HOSTS: ${FEED_ALLOWED_HOSTS:-}
      # Kein REDIS_URL: der Worker liegt nicht im Redis-Netz (app-db) und nutzt
      # den prozesslokalen Cache.
    depends_on:
      web:
        condition: service_healthy
    networks:
      - worker-db
      - egress
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  notify-worker:
    image: ${WACHBUCH_REGISTRY:-ghcr.io/katschko-it}/rettungswache-wachbuch:${WACHBUCH_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    # Prüft abgelaufene Desinfektions-Einwirkzeiten und benachrichtigt die
    # Besatzung (kein automatischer Statuswechsel). Kein HTTP-Listener.
    # Nach jedem erfolgreichen Durchlauf wird die Heartbeat-Datei erneuert;
    # nach 10 Fehlversuchen in Folge beendet sich der Befehl mit Fehler und
    # Docker startet ihn neu.
    command: ["python", "manage.py", "notify_crew", "--watch", "--interval", "30",
              "--heartbeat-file", "/tmp/notify_crew.alive"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/notify_crew.alive') < 180 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      ALLOWED_HOSTS: localhost
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      PUSH_RELAY_URL: ${PUSH_RELAY_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SIGNAL_API_URL: ${SIGNAL_API_URL:-}
      SIGNAL_NUMBER: ${SIGNAL_NUMBER:-}
      SITE_URL: ${SITE_URL:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      # Öffentliche Demo: dann verschickt der Dienst weder E-Mails noch Signal.
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_SANDBOX: ${DEMO_SANDBOX:-false}
    depends_on:
      web:
        condition: service_healthy
    # Ohne eigenes Netz läge der Dienst nur im Default-Netz und erreichte
    # weder db noch redis ("failed to resolve host 'db'").
    networks:
      - app-db
      - signal-api
      # Ausgehend nur für SMTP (E-Mail-Erinnerungen), falls EMAIL_HOST gesetzt ist.
      - egress
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  push-worker:
    image: ${WACHBUCH_REGISTRY:-ghcr.io/katschko-it}/rettungswache-wachbuch:${WACHBUCH_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    command: ["/app/scripts/start-push-worker.sh"]
    environment:
      DJANGO_SECRET_KEY: ${PUSH_WORKER_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${PUSH_DB_USER:-rwsth_push}
      DB_PASSWORD: ${PUSH_DB_PASSWORD:-}
      ALLOWED_HOSTS: localhost
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_ADMIN_EMAIL: ${VAPID_ADMIN_EMAIL:-ops@localhost}
      PUSH_RELAY_URL: ${PUSH_RELAY_URL:-}
      PUSH_RELAY_TOKEN: ${PUSH_RELAY_TOKEN:-}
      PUSH_ALLOWED_ENDPOINT_HOSTS: ${PUSH_ALLOWED_ENDPOINT_HOSTS:-}
      # Kein REDIS_URL: der Worker liegt nicht im Redis-Netz (app-db).
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/push_worker.alive"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - worker-db
      - egress
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backup-init:
    image: ${WACHBUCH_REGISTRY:-ghcr.io/katschko-it}/rettungswache-wachbuch-backup:${WACHBUCH_VERSION:-latest}
    restart: "no"
    user: "0:0"
    # /offsite best effort: ein NFS-Ziel mit root_squash lässt kein chown zu;
    # dann muss der Ordner auf dem Host bereits UID/GID 70 gehören.
    command:
      - /bin/sh
      - -ec
      - >-
        chown ${BACKUP_UID:-70}:${BACKUP_GID:-70} /backups && chmod 0700 /backups;
        chown ${BACKUP_UID:-70}:${BACKUP_GID:-70} /offsite 2>/dev/null && chmod 0700 /offsite
        || echo "Hinweis: /offsite (BACKUP_OFFSITE_DIR) nicht anpassbar; Besitzer auf dem Host pruefen."
    volumes:
      - backups-data:/backups
      - ${BACKUP_OFFSITE_DIR:-backups-offsite}:/offsite
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true

  backup:
    image: ${WACHBUCH_REGISTRY:-ghcr.io/katschko-it}/rettungswache-wachbuch-backup:${WACHBUCH_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    user: "${BACKUP_UID:-70}:${BACKUP_GID:-70}"
    entrypoint: ["/bin/sh", "/usr/local/bin/rwsth-backup-loop"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${BACKUP_DB_USER}
      PGPASSWORD: ${BACKUP_DB_PASSWORD}
      BACKUP_ENCRYPT_REMOTE: ${BACKUP_ENCRYPT_REMOTE:-false}
      BACKUP_GPG_RECIPIENT: ${BACKUP_GPG_RECIPIENT:-}
      BACKUP_OFF_TARGET: ${BACKUP_OFF_TARGET:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-3600}
      BACKUP_UID: ${BACKUP_UID:-70}
      # Read-only Container: Schlüsselbund im tmpfs, Import beim Start aus
      # dem read-only gemounteten Schlüsselordner.
      GNUPGHOME: /tmp/gnupg
      BACKUP_GPG_KEY_DIR: /run/backup-gpg
    depends_on:
      backup-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      # Erster Dump erst nach den Migrationen, sonst sichert er ein leeres Schema.
      migrate:
        condition: service_completed_successfully
    networks:
      - backup-db
    volumes:
      - backups-data:/backups
      # Offsite-Ziel: Host-Ordner (z. B. NAS-Mount) per BACKUP_OFFSITE_DIR,
      # dazu BACKUP_OFF_TARGET=file:///offsite. Ohne Angabe ein leeres Volume.
      - ${BACKUP_OFFSITE_DIR:-backups-offsite}:/offsite
      # Öffentliche GnuPG-Schlüssel (*.asc) für BACKUP_ENCRYPT_REMOTE=true.
      - ${BACKUP_GPG_KEY_DIR:-backups-gpg-keys}:/run/backup-gpg:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  restore-test:
    profiles: ["ops"]
    image: ${WACHBUCH_REGISTRY:-ghcr.io/katschko-it}/rettungswache-wachbuch-backup:${WACHBUCH_VERSION:-latest}
    restart: "no"
    user: "${BACKUP_UID:-70}:${BACKUP_GID:-70}"
    entrypoint: ["/bin/sh", "/usr/local/bin/rwsth-restore-test"]
    environment:
      RESTORE_OWNER: "1"
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backup-db
    volumes:
      - backups-data:/backups:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Öffentliche Demo (docs/DEMO.md): löscht beendete und abgelaufene
  # Demo-Wachen. Läuft mit den Rechten des Datenbank-Eigentümers, weil auch
  # append-only Zeilen der Demo-Wachen gelöscht werden. COMPOSE_PROFILES=demo.
  demo-cleaner:
    image: ${WACHBUCH_REGISTRY:-ghcr.io/katschko-it}/rettungswache-wachbuch:${WACHBUCH_VERSION:-latest}
    profiles: ["demo"]
    restart: unless-stopped
    logging: *default-logging
    command: ["sh", "-c", "while true; do python manage.py purge_demo_sandboxes; sleep 60; done"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      CRYPTO_MASTER_KEY: ${CRYPTO_MASTER_KEY:-}
      DJANGO_DEBUG: "false"
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ALLOWED_HOSTS: localhost
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_SANDBOX: ${DEMO_SANDBOX:-false}
      DEMO_SANDBOX_IDLE_MINUTES: ${DEMO_SANDBOX_IDLE_MINUTES:-30}
      DEMO_SANDBOX_MAX_MINUTES: ${DEMO_SANDBOX_MAX_MINUTES:-120}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app-db
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Optionaler Signal-Versand (docs/SIGNAL.md): COMPOSE_PROFILES=signal und in
  # .env SIGNAL_API_URL=http://signal:8080 sowie SIGNAL_NUMBER=+49… setzen.
  # Läuft als verknüpftes Gerät eines Signal-Kontos der Wache; die REST-API hat
  # keine eigene Anmeldung und ist deshalb nur im internen Netz signal-api
  # erreichbar (kein Port nach außen).
  signal:
    profiles: ["signal"]
    image: bbernhard/signal-cli-rest-api:0.101@sha256:2cf09d66a86fdd210e42ee91662216364acc27da1163a8c44167a77ea3a6559a
    restart: unless-stopped
    logging: *default-logging
    environment:
      MODE: native
    volumes:
      # Schlüssel des verknüpften Geräts; mit .env sichern.
      - signal-data:/home/.local/share/signal-cli
    networks:
      - signal-api
      - egress
    # s6-overlay im Image wechselt per setuid auf einen eigenen Benutzer; mit
    # no-new-privileges startet es nicht. Mehr Rechte als diese braucht es nicht
    # (geprüft mit 0.101).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  # Optionaler TLS-Proxy: COMPOSE_PROFILES=https (install.sh --mode lan|domain).
  # LAN: CADDY_TLS=internal (eigene CA); Domain: CADDY_TLS=<E-Mail> für
  # Let's Encrypt. Konfiguration: deploy/caddy/Caddyfile.
  caddy:
    profiles: ["https"]
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTP_REDIRECT_PORT:-80}:80"
    environment:
      WACHBUCH_HOSTNAME: ${WACHBUCH_HOSTNAME:-localhost}
      CADDY_TLS: ${CADDY_TLS:-internal}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Zertifikate, Schlüssel und die interne CA; mit .env sichern.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - web-ingress
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

networks:
  # Internal only: no outbound internet, no host exposure.
  app-db:
    internal: true
  worker-db:
    internal: true
  backup-db:
    internal: true
  # Published HTTP port for the reverse proxy / local browser.
  web-ingress:
  # Outbound HTTPS for the feed worker allowlist.
  egress:
  # Signal-REST-API (Profil "signal"): nur web und notify-worker erreichen sie.
  signal-api:
    internal: true

volumes:
  postgres-data:
  backups-data:
  # Platzhalter, solange BACKUP_OFFSITE_DIR / BACKUP_GPG_KEY_DIR leer sind.
  backups-offsite:
  backups-gpg-keys:
  # TLS-Proxy (Profil https)
  caddy-data:
  caddy-config:
  signal-data:
