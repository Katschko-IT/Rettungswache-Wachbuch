name: rettungswache-wachbuch

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  db:
    image: postgres:17.11-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    restart: unless-stopped
    logging: *default-logging
    # The official image reads its configuration from $PGDATA/postgresql.conf,
    # NOT from /etc/postgresql. Without this explicit config_file the read-only
    # mount below is silently ignored, so the tuning settings never apply.
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      FEED_DB_USER: ${FEED_DB_USER}
      FEED_DB_PASSWORD: ${FEED_DB_PASSWORD}
      BACKUP_DB_USER: ${BACKUP_DB_USER}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD}
      PUSH_DB_USER: ${PUSH_DB_USER:-rwsth_push}
      PUSH_DB_PASSWORD: ${PUSH_DB_PASSWORD:-disabled}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-rwsth-roles.sh:ro
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - app-db
      - worker-db
      - backup-db
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.8.3-alpine@sha256:dc95ea2fcf5d5c4253be0f967c28143d0f625846197eed2fd32c748eb99abfca
    restart: unless-stopped
    logging: *default-logging
    # Redis is an expendable cache only. Sessions remain durable in PostgreSQL
    # via Django cached_db; do not persist a second copy of cache/session data.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - app-db
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  migrate:
    build: .
    image: rettungswache-wachbuch:local
    command: ["/app/scripts/migrate.sh"]
    restart: "no"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      CRYPTO_MASTER_KEY: ${CRYPTO_MASTER_KEY:-}
      CRYPTO_PREVIOUS_MASTER_KEY: ${CRYPTO_PREVIOUS_MASTER_KEY:-}
      DJANGO_DEBUG: "false"
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      APP_DB_USER: ${APP_DB_USER}
      FEED_DB_USER: ${FEED_DB_USER}
      BACKUP_DB_USER: ${BACKUP_DB_USER}
      PUSH_DB_USER: ${PUSH_DB_USER:-rwsth_push}
      PUSH_DB_PASSWORD: ${PUSH_DB_PASSWORD:-disabled}
      DEFAULT_STATION_NAME: ${DEFAULT_STATION_NAME:-Rettungswache}
      DEFAULT_STATION_SLUG: ${DEFAULT_STATION_SLUG:-rettungswache}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo-Passwort-12345}
      MFA_ENABLED: ${MFA_ENABLED:-true}
      MFA_REQUIRED: ${MFA_REQUIRED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-db
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build: .
    image: rettungswache-wachbuch:local
    restart: unless-stopped
    logging: *default-logging
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      CRYPTO_MASTER_KEY: ${CRYPTO_MASTER_KEY:-}
      CRYPTO_PREVIOUS_MASTER_KEY: ${CRYPTO_PREVIOUS_MASTER_KEY:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      # Explicit opt-in; never pass the insecure QR test override to this service.
      SETUP_BOOTSTRAP_TOKEN: ${SETUP_BOOTSTRAP_TOKEN:-}
      QR_LOGIN_ENABLED: ${QR_LOGIN_ENABLED:-false}
      QR_LOGIN_TTL_SECONDS: ${QR_LOGIN_TTL_SECONDS:-120}
      SITE_URL: ${SITE_URL:-}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-false}
      DB_HOST: db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8090}
      DEFAULT_STATION_NAME: ${DEFAULT_STATION_NAME:-Rettungswache}
      DEFAULT_STATION_SLUG: ${DEFAULT_STATION_SLUG:-rettungswache}
      APP_NAME: ${APP_NAME:-Wachbuch}
      SOURCE_URL: ${SOURCE_URL:-https://github.com/Katschko-IT/Rettungswache-Wachbuch}
      FEED_ALLOWED_HOSTS: ${FEED_ALLOWED_HOSTS:-}
      RETENTION_FEED_DAYS: ${RETENTION_FEED_DAYS:-90}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-0}
      MFA_ENABLED: ${MFA_ENABLED:-true}
      MFA_REQUIRED: ${MFA_REQUIRED:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo-Passwort-12345}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      REGISTRATION_RATE_LIMIT: ${REGISTRATION_RATE_LIMIT:-5}
      WEBAUTHN_ENABLED: ${WEBAUTHN_ENABLED:-true}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_ADMIN_EMAIL: ${VAPID_ADMIN_EMAIL:-ops@localhost}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Wachenterminal und lokales Zertifikat (docs/PI-WACHENTERMINAL.md)
      TERMINAL_ENABLED: ${TERMINAL_ENABLED:-false}
      TERMINAL_IDLE_SECONDS: ${TERMINAL_IDLE_SECONDS:-120}
      LOCAL_TLS_CERT_SHA256: ${LOCAL_TLS_CERT_SHA256:-}
      TERMINAL_WIFI_SSID: ${TERMINAL_WIFI_SSID:-}
      TERMINAL_WIFI_PASSWORD: ${TERMINAL_WIFI_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8090}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-db
      - web-ingress
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  feed-worker:
    image: rettungswache-wachbuch:local
    restart: unless-stopped
    logging: *default-logging
    command: ["/app/scripts/start-worker.sh"]
    # The shared image probes Gunicorn on port 8000. This worker has no HTTP
    # listener, so inheriting that healthcheck creates a false unhealthy.
    healthcheck:
      disable: true
    environment:
      DJANGO_SECRET_KEY: ${FEED_WORKER_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${FEED_DB_USER}
      DB_PASSWORD: ${FEED_DB_PASSWORD}
      ALLOWED_HOSTS: localhost
      FEED_ALLOWED_HOSTS: ${FEED_ALLOWED_HOSTS:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - worker-db
      - egress
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  notify-worker:
    image: rettungswache-wachbuch:local
    restart: unless-stopped
    logging: *default-logging
    # Prüft abgelaufene Desinfektions-Einwirkzeiten und benachrichtigt die
    # Besatzung (kein automatischer Statuswechsel). Kein HTTP-Listener.
    command: ["python", "manage.py", "notify_crew", "--watch", "--interval", "30"]
    healthcheck:
      disable: true
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      ALLOWED_HOSTS: localhost
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      PUSH_RELAY_URL: ${PUSH_RELAY_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      web:
        condition: service_healthy

  push-worker:
    image: rettungswache-wachbuch:local
    restart: unless-stopped
    logging: *default-logging
    command: ["/app/scripts/start-push-worker.sh"]
    environment:
      DJANGO_SECRET_KEY: ${PUSH_WORKER_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${PUSH_DB_USER}
      DB_PASSWORD: ${PUSH_DB_PASSWORD}
      ALLOWED_HOSTS: localhost
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_ADMIN_EMAIL: ${VAPID_ADMIN_EMAIL:-ops@localhost}
      PUSH_RELAY_URL: ${PUSH_RELAY_URL:-}
      PUSH_RELAY_TOKEN: ${PUSH_RELAY_TOKEN:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/push_worker.alive"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - worker-db
      - egress
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backup-init:
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: rettungswache-wachbuch-backup:local
    restart: "no"
    user: "0:0"
    command: ["/bin/sh", "-ec", "chown ${BACKUP_UID:-70}:${BACKUP_GID:-70} /backups && chmod 0700 /backups"]
    volumes:
      - backups-data:/backups
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: rettungswache-wachbuch-backup:local
    restart: unless-stopped
    logging: *default-logging
    user: "${BACKUP_UID:-70}:${BACKUP_GID:-70}"
    entrypoint: ["/bin/sh", "/usr/local/bin/rwsth-backup-loop"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${BACKUP_DB_USER}
      PGPASSWORD: ${BACKUP_DB_PASSWORD}
      BACKUP_ENCRYPT_REMOTE: ${BACKUP_ENCRYPT_REMOTE:-false}
      BACKUP_GPG_RECIPIENT: ${BACKUP_GPG_RECIPIENT:-}
      BACKUP_OFF_TARGET: ${BACKUP_OFF_TARGET:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    depends_on:
      backup-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - backup-db
    volumes:
      - backups-data:/backups
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  restore-test:
    profiles: ["ops"]
    image: rettungswache-wachbuch-backup:local
    restart: "no"
    user: "${BACKUP_UID:-70}:${BACKUP_GID:-70}"
    entrypoint: ["/bin/sh", "/usr/local/bin/rwsth-restore-test"]
    environment:
      RESTORE_OWNER: "1"
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backup-db
    volumes:
      - backups-data:/backups:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  # Internal only: no outbound internet, no host exposure.
  app-db:
    internal: true
  worker-db:
    internal: true
  backup-db:
    internal: true
  # Published HTTP port for the reverse proxy / local browser.
  web-ingress:
  # Outbound HTTPS for the feed worker allowlist.
  egress:

volumes:
  postgres-data:
  backups-data:
  redis-data:
