version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    reviewers:
      - "darkspike1988"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      django:
        patterns:
          - "Django"
          - "django-*"
        update-types: ["minor", "patch"]
      security:
        patterns:
          - "*"
        update-types: ["security"]

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  # axe-core-Prüfung der CI (tests/a11y, gesperrt über package-lock.json)
  - package-ecosystem: "npm"
    directory: "/tests/a11y"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "accessibility"
