name: Refresh release images

# Baut das aktuelle Release jede Woche ohne Cache neu. So kommen
# Sicherheitsupdates der Basis (Debian per apt-get upgrade, Alpine per
# apk upgrade) bei den Wachen an, ohne dass es eine neue Version braucht:
# `wachbuch auto-update` im Modus „sicherheit“ holt genau diese Images.
#
# Veröffentlicht wird nur, was Sicherheitsscan und Starttest besteht. Sonst
# bleiben die bisherigen Images stehen und es entsteht ein Issue.

on:
  schedule:
    - cron: "17 2 * * 1"  # montags 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-images
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*)
              echo "tag=$tag" >>"$GITHUB_OUTPUT"
              echo "Neubau von $tag"
              ;;
            *) echo "Kein veröffentlichtes Release – nichts zu tun." ;;
          esac

  refresh:
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/katschko-it/rettungswache-wachbuch
            dockerfile: Dockerfile
            target: runtime
          - image: ghcr.io/katschko-it/rettungswache-wachbuch-backup
            dockerfile: Dockerfile.backup
            target: backup
          - image: ghcr.io/katschko-it/rettungswache-wachbuch-db
            dockerfile: Dockerfile.backup
            target: db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.tag }}
            type=raw,value=latest

      # 1. Ohne Cache für amd64 bauen und lokal laden: Scan und Starttest.
      - name: Build for checks (amd64, no cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          pull: true
          no-cache: true
          load: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: refresh-check:${{ matrix.target }}
      - name: Security gate (Trivy, HIGH/CRITICAL with fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: refresh-check:${{ matrix.target }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Smoke test
        run: |
          set -eu
          image=refresh-check:${{ matrix.target }}
          case "${{ matrix.target }}" in
            runtime)
              docker run --rm -e DJANGO_SECRET_KEY=refresh-smoke-only -e DJANGO_DEBUG=false \
                -e DATABASE_URL=sqlite:////tmp/smoke.sqlite3 \
                "$image" python manage.py check
              ;;
            backup)
              docker run --rm --entrypoint sh "$image" -c 'pg_dump --version && gpg --version | head -n 1'
              ;;
            db)
              docker run -d --name refresh-db \
                -e POSTGRES_DB=rwsth -e POSTGRES_USER=rwsth_owner -e POSTGRES_PASSWORD=smoke \
                -e APP_DB_USER=rwsth_app -e APP_DB_PASSWORD=smoke \
                -e FEED_DB_USER=rwsth_feed -e FEED_DB_PASSWORD=smoke \
                -e BACKUP_DB_USER=rwsth_backup -e BACKUP_DB_PASSWORD=smoke \
                -e PUSH_DB_USER=rwsth_push -e PUSH_DB_PASSWORD=smoke \
                "$image"
              for _ in $(seq 1 60); do
                if docker exec refresh-db pg_isready -U rwsth_owner -d rwsth >/dev/null 2>&1 \
                  && docker exec refresh-db psql -U rwsth_owner -d rwsth -tAc \
                    "SELECT count(*) FROM pg_roles WHERE rolname LIKE 'rwsth_%'" | grep -q '^5$'; then
                  echo "Datenbank bereit, Rollen angelegt."
                  docker rm -f refresh-db >/dev/null
                  exit 0
                fi
                sleep 2
              done
              docker logs refresh-db
              exit 1
              ;;
          esac

      # 2. Erst nach bestandenen Prüfungen für beide Architekturen veröffentlichen.
      - name: Publish (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  report-failure:
    needs: [resolve, refresh]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Wöchentlicher Image-Neubau fehlgeschlagen (${TAG:-ohne Release})"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
              --json number --jq 'length' | grep -q '^0$'; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body \
              "Der Neubau der Release-Images ist gescheitert ($RUN_URL). Die bisherigen Images bleiben veröffentlicht; Wachen mit \`auto-update sicherheit\` erhalten bis zur Behebung keine neuen Basis-Updates."
          else
            echo "Issue existiert bereits."
          fi
