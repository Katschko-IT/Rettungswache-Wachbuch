name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  django:
    timeout-minutes: 30
    env:
      REDIS_URL: ""
      REDIS_HOST: ""
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Isolated Python environment
        run: |
          uv venv --seed --managed-python --python 3.14 "$RUNNER_TEMP/wachbuch-venv"
          echo "$RUNNER_TEMP/wachbuch-venv/bin" >> "$GITHUB_PATH"
          echo "DATABASE_URL=sqlite:///$RUNNER_TEMP/wachbuch-ci-$GITHUB_RUN_ID.sqlite3" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked dependencies with hash verification
        run: pip install --require-hashes -r requirements.lock -r requirements-ci.lock
      - name: Compile Python sources
        run: python -m compileall -q config core
      - name: Run dependency vulnerability audit
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit-venv"
          "$RUNNER_TEMP/pip-audit-venv/bin/pip" install --require-hashes -r requirements-audit.lock
          "$RUNNER_TEMP/pip-audit-venv/bin/pip-audit" --strict --format=columns \
            --requirement requirements.lock
      - name: Run Ruff baseline lint
        run: ruff check config core --select E4,E7,E9 --output-format=concise
      - name: Check JavaScript syntax
        run: |
          # Alle App-Skripte, auch neue; den gerenderten Service Worker prüft
          # core/test_housekeeping.py.
          for script in core/static/core/*.js; do
            node --check "$script"
          done
      - name: Check i18n catalogs and checked-in .mo files
        run: python scripts/i18n_catalog.py check
      - name: Test fail-closed Dependabot gate offline on every PR
        run: bash scripts/tests/test_check_dependabot_alerts.sh
      - name: Check migrations
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: "false"
        run: python manage.py makemigrations --check --dry-run --settings=config.test_settings
      - name: Run deployment checks
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: "false"
          SECURE_COOKIES: "true"
          ALLOWED_HOSTS: example.test
          CSRF_TRUSTED_ORIGINS: https://example.test
        run: python manage.py check --deploy --settings=config.settings
      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: "false"
        run: python manage.py test --settings=config.test_settings

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint installer and container scripts
        run: |
          shellcheck --version
          shellcheck install.sh scripts/wachbuch scripts/backup-loop.sh scripts/init-db.sh \
            scripts/start-web.sh scripts/start-worker.sh scripts/start-push-worker.sh \
            scripts/migrate.sh scripts/restore-test.sh \
            deploy/hetzner/harden-host.sh deploy/hetzner/wachwerk-health.sh \
            deploy/hetzner/offsite-storagebox.sh
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          COMPOSE_PROFILES=https,ops,demo,signal docker compose -f docker-compose.yml -f compose.build.yml config --quiet
      - name: Validate Caddyfile with the pinned Caddy image
        run: |
          # Ein Fehler im Caddyfile legte sonst nach dem nächsten Update jede
          # Installation mit TLS-Proxy lahm (Caddy startet nicht).
          caddy_image=$(COMPOSE_PROFILES=https docker compose -f docker-compose.yml config --images | grep '^caddy:')
          for host in wache.example.test 192.168.1.20; do
            for tls in internal ops@example.test; do
              docker run --rm -e WACHBUCH_HOSTNAME="$host" -e CADDY_TLS="$tls" \
                -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
                "$caddy_image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            done
          done
      - name: Build all images (app, backup, db)
        run: docker compose -f docker-compose.yml -f compose.build.yml build
      - name: Reject runtime data in image
        run: |
          test -z "$(docker run --rm --entrypoint sh rettungswache-wachbuch:local -c \
            'find /app -type f \( -name "*.dump" -o -name "*.sqlite3" -o -name "*.pyc" \) -print')"
      - name: Verify language catalogs ship in the image
        run: |
          docker run --rm --entrypoint python rettungswache-wachbuch:local -c \
            "import gettext; g = gettext.GNUTranslations(open('/app/locale/en/LC_MESSAGES/django.mo','rb')); assert g.gettext('Anmelden') == 'Sign in', g.gettext('Anmelden')"
      - name: Scan container image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rettungswache-wachbuch:local
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Start the complete stack (all services, public-demo profile)
        run: |
          export COMPOSE_FILE=docker-compose.yml:compose.build.yml COMPOSE_PROFILES=demo
          # ALLOWED_HOSTS ohne Loopback: der Healthcheck muss trotzdem gelingen.
          # Wie demo.rwsth.de: mit demo-cleaner und Demo-Wache je Besuch.
          HTTP_PORT=18091 ALLOWED_HOSTS=wache.example.test DEMO_MODE=true DEMO_SANDBOX=true \
            docker compose up --detach --wait --wait-timeout 300
      - name: Verify health, workers and database restrictions
        run: |
          export COMPOSE_FILE=docker-compose.yml:compose.build.yml COMPOSE_PROFILES=demo
          curl --fail --silent --show-error http://127.0.0.1:18091/healthz/
          health() { docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$(docker compose ps -q "$1")"; }
          for service in web db redis feed-worker notify-worker push-worker housekeeping demo-cleaner; do
            test "$(health "$service")" = "healthy" || { echo "$service: $(health "$service")"; exit 1; }
          done
          test "$(docker inspect -f '{{.State.Status}}' "$(docker compose ps -q backup)")" = "running"
          # Aufräumen und Demo-Löschung gegen das echte PostgreSQL mit den
          # Rollen aus grant_database_access (Exit-Code statt Log-Suche).
          docker compose exec -T housekeeping python manage.py housekeeping
          docker compose exec -T demo-cleaner python manage.py purge_demo_sandboxes --verbosity 2
          # Müllkalender im feed-worker: core_station nur spaltenweise lesbar.
          docker compose exec -T feed-worker python manage.py sync_waste_calendar
          # notify-worker must really talk to the database (K1).
          docker compose logs notify-worker | grep -q "Datenbank erreichbar"
          # The db image ships config/postgresql.conf; assert the EXACT
          # config_file path, otherwise the file would be silently ignored and
          # the official image would fall back to $PGDATA defaults. The small
          # defaults (128MB/50) keep the stack bootable on 1-2 GB hosts.
          # statement_timeout is only set in the file and proves it is read.
          q() { docker compose exec -T db psql -U rwsth_owner -d rwsth -tAc "$1"; }
          test "$(q 'SHOW config_file')" = "/etc/postgresql/postgresql.conf"
          test "$(q 'SHOW shared_buffers')" = "128MB"
          test "$(q 'SHOW max_connections')" = "50"
          test "$(q 'SHOW statement_timeout')" = "1min"
          test "$(q "SELECT has_table_privilege('rwsth_app', 'core_auditevent', 'UPDATE')")" = "f"
          test "$(q "SELECT has_table_privilege('rwsth_app', 'core_auditevent', 'DELETE')")" = "f"
          test "$(q "SELECT has_column_privilege('rwsth_feed', 'core_station', 'waste_calendar_url', 'SELECT')")" = "t"
          test "$(q "SELECT has_column_privilege('rwsth_feed', 'core_station', 'iban', 'SELECT')")" = "f"
          test "$(q "SELECT has_table_privilege('rwsth_backup', 'core_handoverentry', 'SELECT')")" = "t"
          test "$(q "SELECT has_table_privilege('rwsth_backup', 'core_handoverentry', 'INSERT')")" = "f"
          test "$(q "SELECT has_table_privilege('rwsth_backup', 'core_handoverentry', 'UPDATE')")" = "f"
          test "$(q "SELECT has_table_privilege('rwsth_backup', 'core_handoverentry', 'DELETE')")" = "f"
          # Backup dump and restore probe.
          docker compose exec -T backup /bin/sh /usr/local/bin/rwsth-backup-loop once
          docker compose run --rm restore-test
      - name: Show logs after failure
        if: failure()
        run: COMPOSE_FILE=docker-compose.yml:compose.build.yml COMPOSE_PROFILES=demo docker compose logs --no-color
      - name: Remove stack
        if: always()
        run: COMPOSE_FILE=docker-compose.yml:compose.build.yml docker compose --profile ops --profile demo down --volumes --remove-orphans
      - name: Installer end-to-end (local build, two runs)
        run: |
          target="$RUNNER_TEMP/wachbuch"
          sh install.sh --source "$GITHUB_WORKSPACE" --build --yes --mode local \
            --port 18092 --project wbci --name "RW CI-Wache" --dir "$target"
          cp "$target/.env" "$RUNNER_TEMP/env-first-run"
          sh install.sh --source "$GITHUB_WORKSPACE" --build --yes --dir "$target"
          diff "$RUNNER_TEMP/env-first-run" "$target/.env"
          test "$(stat -c %a "$target/.env")" = "600"
          curl --fail --silent --show-error http://127.0.0.1:18092/healthz/
          curl --fail --silent --show-error -o /dev/null http://localhost:18092/setup/
          "$target/wachbuch" status
          "$target/wachbuch" backup
          ls "$target"/backups/rwsth-*.dump
      - name: Installer logs after failure
        if: failure()
        run: cd "$RUNNER_TEMP/wachbuch" && docker compose logs --no-color || true
      - name: Uninstall
        if: always()
        run: |
          if [ -x "$RUNNER_TEMP/wachbuch/wachbuch" ]; then
            "$RUNNER_TEMP/wachbuch/wachbuch" uninstall --purge --yes
          fi
