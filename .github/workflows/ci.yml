name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  django:
    timeout-minutes: 30
    env:
      REDIS_URL: ""
      REDIS_HOST: ""
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Isolated Python environment
        run: |
          uv venv --seed --managed-python --python 3.14 "$RUNNER_TEMP/wachbuch-venv"
          echo "$RUNNER_TEMP/wachbuch-venv/bin" >> "$GITHUB_PATH"
          echo "DATABASE_URL=sqlite:///$RUNNER_TEMP/wachbuch-ci-$GITHUB_RUN_ID.sqlite3" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked dependencies with hash verification
        run: pip install --require-hashes -r requirements.lock -r requirements-ci.lock
      - name: Compile Python sources
        run: python -m compileall -q config core
      - name: Run dependency vulnerability audit
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit-venv"
          "$RUNNER_TEMP/pip-audit-venv/bin/pip" install --require-hashes -r requirements-audit.lock
          "$RUNNER_TEMP/pip-audit-venv/bin/pip-audit" --strict --format=columns \
            --requirement requirements.lock
      - name: Run Ruff baseline lint
        run: ruff check config core --select E4,E7,E9 --output-format=concise
      - name: Check JavaScript syntax
        run: |
          node --check core/static/core/app.js
          node --check core/static/core/json_data.js
          node --check core/static/core/ui.js
          node --check core/static/core/display.js
          node --check core/static/core/terminal.js
          node --check core/static/core/osk.js
      - name: Check i18n catalogs and checked-in .mo files
        run: python scripts/i18n_catalog.py check
      - name: Test fail-closed Dependabot gate offline on every PR
        run: bash scripts/tests/test_check_dependabot_alerts.sh
      - name: Check migrations
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: "false"
        run: python manage.py makemigrations --check --dry-run --settings=config.test_settings
      - name: Run deployment checks
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: "false"
          SECURE_COOKIES: "true"
          ALLOWED_HOSTS: example.test
          CSRF_TRUSTED_ORIGINS: https://example.test
        run: python manage.py check --deploy --settings=config.settings
      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: "false"
        run: python manage.py test --settings=config.test_settings

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose
        run: cp .env.example .env && docker compose config --quiet
      - name: Build web image
        run: docker build --tag rettungswache-wachbuch:test .
      - name: Reject runtime data in image
        run: |
          test -z "$(docker run --rm --entrypoint sh rettungswache-wachbuch:test -c \
            'find /app -type f \( -name "*.dump" -o -name "*.sqlite3" -o -name "*.pyc" \) -print')"
      - name: Verify language catalogs ship in the image
        run: |
          docker run --rm --entrypoint python rettungswache-wachbuch:test -c \
            "import gettext; g = gettext.GNUTranslations(open('/app/locale/en/LC_MESSAGES/django.mo','rb')); assert g.gettext('Anmelden') == 'Sign in', g.gettext('Anmelden')"
      - name: Scan container image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rettungswache-wachbuch:test
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Start isolated PostgreSQL stack
        run: |
          sudo chown 70:70 backups
          HTTP_PORT=18091 docker compose up --build --detach web
      - name: Verify health and database restrictions
        run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18091/healthz/ && break
            test "$attempt" -lt 30
            sleep 2
          done
          # The db service must load the mounted config/postgresql.conf. Assert
          # the EXACT config_file path the compose command sets, otherwise the
          # read-only mount would be silently ignored and the official image
          # would fall back to $PGDATA defaults. The small defaults (128MB/50)
          # keep the stack bootable on 1-2 GB hosts. statement_timeout is only
          # set in the file (not on the command line) and proves it is read.
          test "$(docker compose exec -T db psql -U rwsth_owner -d rwsth -tAc \
            'SHOW config_file')" = "/etc/postgresql/postgresql.conf"
          test "$(docker compose exec -T db psql -U rwsth_owner -d rwsth -tAc \
            'SHOW shared_buffers')" = "128MB"
          test "$(docker compose exec -T db psql -U rwsth_owner -d rwsth -tAc \
            'SHOW max_connections')" = "50"
          test "$(docker compose exec -T db psql -U rwsth_owner -d rwsth -tAc \
            'SHOW statement_timeout')" = "1min"
          test "$(docker compose exec -T db psql -U rwsth_owner -d rwsth -tAc \
            "SELECT has_table_privilege('rwsth_app', 'core_auditevent', 'UPDATE')")" = "f"
          test "$(docker compose exec -T db psql -U rwsth_owner -d rwsth -tAc \
            "SELECT has_table_privilege('rwsth_backup', 'core_handoverentry', 'SELECT')")" = "t"
          test "$(docker compose exec -T db psql -U rwsth_owner -d rwsth -tAc \
            "SELECT has_table_privilege('rwsth_backup', 'core_handoverentry', 'INSERT')")" = "f"
          test "$(docker compose exec -T db psql -U rwsth_owner -d rwsth -tAc \
            "SELECT has_table_privilege('rwsth_backup', 'core_handoverentry', 'UPDATE')")" = "f"
          test "$(docker compose exec -T db psql -U rwsth_owner -d rwsth -tAc \
            "SELECT has_table_privilege('rwsth_backup', 'core_handoverentry', 'DELETE')")" = "f"
      - name: Show logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove isolated stack
        if: always()
        run: docker compose down --volumes --remove-orphans
