name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * *'  # Täglich um Mitternacht
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  vulnerability-alerts: read

concurrency:
  group: security-scan
  cancel-in-progress: false

# Gate semantics (documented, see docs/WAVE-3-READINESS.md):
#   * BLOCKING: trivy-docker-scan (HIGH/CRITICAL, exit-code 1) and
#     dependabot-alerts (fail-closed high/critical gate; an API error is never
#     silently treated as "0 alerts").
#   * INFORMATIONAL: trivy-fs-scan (exit-code 0) only feeds the GitHub
#     Security tab and does not block.
#   * CONDITIONAL / NOT A GATE without a secret: snyk-scan runs only when the
#     SNYK_TOKEN secret exists. Without it the job emits an explicit skip
#     warning. The effective dependency/image gates are pip-audit (ci.yml) and
#     the blocking Docker Trivy scan.

jobs:
  trivy-docker-scan:
    name: Trivy Docker Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build --tag rettungswache-wachbuch:scan .

      - name: Run Trivy vulnerability scanner (merge gate, aligned with ci.yml docker job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'rettungswache-wachbuch:scan'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
      - name: Run Trivy scan for GitHub Security tab (non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'rettungswache-wachbuch:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
          scanners: 'vuln'

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-docker'

  trivy-fs-scan:
    name: Trivy Filesystem Scan (informational)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy filesystem scanner
        # exit-code 0: this scan is informational and does NOT block. Only the
        # Docker image scan above is a blocking vulnerability gate.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: 0

      - name: Upload Trivy filesystem scan results
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'

  snyk-scan:
    name: Snyk Dependency Scan (conditional, non-blocking without token)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Report Snyk availability (no invented secret)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "${SNYK_TOKEN}" ]; then
            echo "::warning title=Snyk scan skipped::SNYK_TOKEN is not configured. Snyk did NOT run and this job is not a security gate. pip-audit (ci.yml) and the blocking Docker Trivy scan are the effective gates."
          else
            echo "SNYK_TOKEN present: Snyk will run."
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Snyk to check for vulnerabilities
        # Only runs with a configured token. Do NOT treat a skipped step as a
        # passing scan (see the availability warning step above).
        uses: snyk/actions/python@11b673cfb4b0dc0d860a1323caa199d54950dcce # verified upstream commit
        if: env.SNYK_TOKEN != ''
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=all

  dependabot-alerts:
    name: Check Dependabot Alerts
    runs-on: ubuntu-latest
    # Dependabot alerts track the default branch; a PR cannot close them by
    # fixing its own branch. Runs blocking on pushes to main only.
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit-test the fail-closed gate (mocked gh, no network/secrets)
        run: bash scripts/tests/test_check_dependabot_alerts.sh

      - name: Check for blocking Dependabot alerts (high/critical)
        # Fails closed (exit 2) on auth/network/HTTP error, invalid JSON or an
        # unexpected response shape; never converts an API error into "0".
        # Paginates, so >100 alerts are still counted.
        run: bash scripts/check_dependabot_alerts.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
