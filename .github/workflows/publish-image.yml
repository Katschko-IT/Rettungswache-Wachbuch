name: Publish container image

# Baut die drei Images, die docker-compose.yml / install.sh erwarten, für
# linux/amd64 und linux/arm64 (Raspberry Pi OS 64-bit):
#   ghcr.io/katschko-it/rettungswache-wachbuch          (App)
#   ghcr.io/katschko-it/rettungswache-wachbuch-backup   (pg_dump/Restore)
#   ghcr.io/katschko-it/rettungswache-wachbuch-db       (PostgreSQL mit Init)
# Tags bei vX.Y.Z: X.Y.Z, X.Y und latest (latest nicht für Vorabversionen).

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      channel:
        description: Container tag for a manual build
        required: true
        default: edge

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: ghcr.io/katschko-it/rettungswache-wachbuch
            dockerfile: Dockerfile
            target: runtime
          - image: ghcr.io/katschko-it/rettungswache-wachbuch-backup
            dockerfile: Dockerfile.backup
            target: backup
          - image: ghcr.io/katschko-it/rettungswache-wachbuch-db
            dockerfile: Dockerfile.backup
            target: db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Emulation für das arm64-Image (Raspberry Pi) auf dem amd64-Runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
            type=raw,value=${{ inputs.channel }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          # Label-Version aus dem Git-Tag (metadata-action), nicht fest im Dockerfile.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
