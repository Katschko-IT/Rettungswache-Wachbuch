# PostgreSQL-Konfiguration für Rettungswache-Wachbuch
#
# Die Standardwerte sind bewusst klein, damit der Datenbankcontainer auch auf
# Systemen mit 1-2 GB RAM (Raspberry Pi, kleine VM) startet. Ein Wachbuch hat
# wenige gleichzeitige Nutzer; mehr Speicher lohnt erst bei großen Datenmengen.
#
# Einbindung:
# - Die Datei liegt im db-Image unter /etc/postgresql/postgresql.conf
#   (Dockerfile.backup, Ziel "db"). Das offizielle Image liest sonst
#   $PGDATA/postgresql.conf, deshalb setzt der db-Dienst explizit
#       -c config_file=/etc/postgresql/postgresql.conf
# - Speicherwerte lassen sich ohne eigene Datei über .env anheben; die
#   Compose-Datei reicht sie als "-c name=wert" durch (das gewinnt gegen
#   diese Datei):
#       POSTGRES_SHARED_BUFFERS=512MB        (Richtwert 25 % des RAM)
#       POSTGRES_EFFECTIVE_CACHE_SIZE=2GB    (Richtwert 50 % des RAM)
#       POSTGRES_WORK_MEM=8MB
#       POSTGRES_MAINTENANCE_WORK_MEM=256MB
#       POSTGRES_MAX_CONNECTIONS=100
# - Weitergehendes Tuning: eigene Datei per compose.override.yml einhängen
#   (docs/OPERATIONS.md, Abschnitt "Datenbank-Tuning").

# =============================================================================
# MEMORY SETTINGS
# =============================================================================

# Shared Buffers: 128MB (PostgreSQL-Vorgabe). Auf einem eigenen DB-Server etwa
# 25 % des RAM. Größere Werte brauchen ein passendes /dev/shm (Compose shm_size).
shared_buffers = 128MB

# Effective Cache Size: nur ein Planerhinweis, reserviert keinen Speicher.
effective_cache_size = 512MB

# Work Memory: je Sortier-/Hash-Schritt und Verbindung, daher klein halten.
work_mem = 4MB

# Maintenance Work Memory: Used for VACUUM, index creation, etc.
maintenance_work_mem = 64MB

# =============================================================================
# PARALLEL QUERY SETTINGS
# =============================================================================

# Maximum number of parallel worker processes
max_parallel_workers = 2

# Maximum number of parallel workers per gather node
max_parallel_workers_per_gather = 1

# Cost factors for parallel query planning
parallel_tuple_cost = 0.1
parallel_setup_cost = 1000

# =============================================================================
# CONNECTION SETTINGS
# =============================================================================

# Maximum number of concurrent connections
# Web (GUNICORN_WORKERS x GUNICORN_THREADS, Standard 2 x 4) plus Worker,
# Migration und Backup bleiben deutlich unter 50. Bei mehr Gunicorn-Prozessen
# POSTGRES_MAX_CONNECTIONS passend erhöhen.
max_connections = 50

# Connection settings for client applications
# These are used by libpq clients (like Django)
# The actual values depend on your network conditions

# =============================================================================
# WRITE AHEAD LOG (WAL)
# =============================================================================

# WAL Level: minimal, replica, or logical
# For most applications, 'replica' is a good choice
wal_level = replica

# WAL Buffers: Typically 1/32 to 1/16 of shared_buffers
wal_buffers = -1  # Auto-tune (default: 1/32 of shared_buffers)

# WAL Segment Size (wal_segment_size) can only be chosen at initdb time via
# "initdb --wal-segsize"; it cannot be set in postgresql.conf (PostgreSQL
# rejects it with "parameter cannot be changed"). Default is 16MB.

# Synchronous Commit: For durability vs. performance tradeoff
# Options: on, remote_apply, remote_write, local, off
synchronous_commit = on

# =============================================================================
# REPLICATION SETTINGS (for future scaling)
# =============================================================================

# These settings are for future horizontal scaling
# Currently not used, but included for completeness

# hot_standby = on
# max_wal_senders = 10
# wal_keep_size = 1GB

# =============================================================================
# QUERY PLANNER SETTINGS
# =============================================================================

# Random Page Cost: Lower for SSD (1.1), higher for HDD (4.0)
random_page_cost = 1.1

# Effective I/O Concurrency: Number of simultaneous I/O operations
# For SSD: 200-300, for HDD: 1-2
effective_io_concurrency = 200

# =============================================================================
# AUTOVACUUM SETTINGS
# =============================================================================

# Autovacuum: Automatically clean up dead tuples
autovacuum = on

# Autovacuum Max Workers: Number of autovacuum processes that can run in parallel
autovacuum_max_workers = 3

# Autovacuum Naptime: Time between autovacuum runs (in seconds)
autovacuum_naptime = 30s

# Autovacuum Vacuum Threshold: Number of dead tuples before vacuum runs
autovacuum_vacuum_threshold = 50

# Autovacuum Analyze Threshold: Number of changes before analyze runs
autovacuum_analyze_threshold = 50

# Autovacuum Vacuum Scale Factor: Fraction of table size before vacuum runs
autovacuum_vacuum_scale_factor = 0.1

# Autovacuum Analyze Scale Factor: Fraction of table size before analyze runs
autovacuum_analyze_scale_factor = 0.05

# =============================================================================
# LOGGING SETTINGS
# =============================================================================

# Log Destination: stderr, csvlog, syslog, eventlog
log_destination = 'stderr'

# Log Level: debug5, debug4, debug3, debug2, debug1, info, notice, warning, error, log, fatal, panic
log_min_messages = warning

# Log Line Prefix: Format for log messages
log_line_prefix = '%m [%p] %q%u@%d '

# Log Statement: Log all SQL statements (for debugging)
# log_statement = 'all'  # Uncomment for debugging

# Log Duration: Log duration of each query (for performance analysis)
# log_duration = on  # Uncomment for performance analysis

# =============================================================================
# TIMEOUT SETTINGS
# =============================================================================

# Statement Timeout: Maximum time for a query (in milliseconds)
# 0 = no timeout
statement_timeout = 60000  # 60 seconds

# Lock Timeout: Maximum time to wait for a lock (in milliseconds)
# 0 = no timeout
lock_timeout = 30000  # 30 seconds

# Idle in Transaction Session Timeout: Maximum time a transaction can be idle
idle_in_transaction_session_timeout = 10000  # 10 seconds

# =============================================================================
# LOCALE AND FORMATTING
# =============================================================================

# Time Zone: Set to your local time zone
timezone = 'Europe/Berlin'

# Date Style: ISO, SQL, Postgres, German, etc.
datestyle = 'iso, dmy'

# Note: PostgreSQL has no separate "timeformat" parameter. The earlier
# "timeformat = 'H24:MI:SS'" is not a valid GUC and makes the server refuse to
# start ("unrecognized configuration parameter"), so it has been removed.
# DateStyle above controls the date/time format.

# =============================================================================
# OTHER SETTINGS
# =============================================================================

# Listen Addresses: Which IP addresses to listen on
# Use '*' for all, or specific IPs for security
listen_addresses = '*'

# Port: Which port to listen on
port = 5432

# Shared Preload Libraries: Libraries to preload at startup
# shared_preload_libraries = 'pg_stat_statements,pg_cron'  # Uncomment if needed

# Track Activity Query Size: Maximum size of activity query
# track_activity_query_size = 1024  # Default: 1024
