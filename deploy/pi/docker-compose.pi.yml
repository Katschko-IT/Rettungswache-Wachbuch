# Raspberry Pi 4 (4 GB) als Wachen-Server mit eigenem WLAN und Touch-Terminal.
#
#   docker compose -f docker-compose.yml -f compose.build.yml -f deploy/pi/docker-compose.pi.yml up -d --build
#
# Ergänzt die Standard-Compose-Datei um:
# - TLS-Proxy (nginx) auf Port 443 mit dem lokalen Zertifikat aus setup-pi.sh,
# - Speichergrenzen für 4 GB RAM und weniger Gunicorn-Prozesse,
# - Abschalten der Dienste, die Internet brauchen (Feeds, Web-Push).
# Werte kommen aus .env (setup-pi.sh schreibt die Pi-spezifischen Einträge).

services:
  db:
    mem_limit: 1g

  redis:
    mem_limit: 320m

  web:
    mem_limit: 900m
    environment:
      GUNICORN_WORKERS: "2"
      GUNICORN_THREADS: "4"
      GUNICORN_TIMEOUT: "60"

  notify-worker:
    mem_limit: 256m

  # Ohne Internet nutzlos; bei vorhandenem Uplink in .env/hier wieder aktivieren.
  feed-worker:
    deploy:
      replicas: 0

  push-worker:
    deploy:
      replicas: 0

  proxy:
    # Nach dem ersten Pull auf einen Digest festlegen (docker image inspect).
    image: ${PI_NGINX_IMAGE:-nginx:stable-alpine}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${PI_BIND_ADDRESS:-0.0.0.0}:443:443"
      - "${PI_BIND_ADDRESS:-0.0.0.0}:80:80"
    environment:
      PI_SERVER_NAMES: ${PI_SERVER_NAMES:-wachbuch.lan localhost 10.42.0.1}
    volumes:
      - ./deploy/pi/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${PI_TLS_DIR:-/etc/wachbuch/tls}:/etc/nginx/tls:ro
    mem_limit: 64m
    networks:
      - web-ingress
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
