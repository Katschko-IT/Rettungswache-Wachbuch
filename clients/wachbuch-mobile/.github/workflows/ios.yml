name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Enforce App Store toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          flutter --version
          flutter doctor -v
          xcode_major=$(xcodebuild -version | awk 'NR==1 {split($2,v,"."); print v[1]}')
          sdk_major=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
          if [ "$xcode_major" -lt 26 ]; then
            echo "App Store Connect requires Xcode 26 or later" >&2
            exit 1
          fi
          if [ "$sdk_major" -lt 26 ]; then
            echo "App Store Connect requires the iOS 26 SDK or later" >&2
            exit 1
          fi

      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get
          git diff --exit-code -- pubspec.lock
          flutter gen-l10n

      - name: Build for iOS Simulator
        run: flutter build ios --simulator --debug

      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign

      - name: Audit iOS release metadata and privacy manifests
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "de.wachbuch.wachbuchMobile"
          encryption=$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP/Info.plist" | tr '[:upper:]' '[:lower:]')
          case "$encryption" in
            false|no|0) ;;
            *) echo "Unexpected ITSAppUsesNonExemptEncryption value: $encryption" >&2; exit 1 ;;
          esac
          manifest_count=0
          while IFS= read -r -d '' manifest; do
            plutil -lint "$manifest"
            manifest_count=$((manifest_count + 1))
          done < <(find "$APP" -name 'PrivacyInfo.xcprivacy' -type f -print0)
          echo "Validated $manifest_count bundled privacy manifest(s)."

      - name: Package unsigned release artifact
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            dist/Wachbuch-iOS-unsigned.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wachbuch-ios-unsigned
          path: dist/Wachbuch-iOS-unsigned.zip
          if-no-files-found: error
          retention-days: 14
