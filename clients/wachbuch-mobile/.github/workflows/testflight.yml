name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Semantic version from pubspec.yaml, for example 1.0.0
        required: true
        default: 1.0.0
      build_number:
        description: Unique and strictly increasing App Store build number
        required: true
        default: "12"

permissions:
  contents: read

concurrency:
  group: testflight-release
  cancel-in-progress: false

jobs:
  upload:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    environment: testflight
    env:
      RELEASE_BUILD_NAME: ${{ inputs.build_name }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate store release source and version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Store releases must be built from main, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "build_name must use MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "build_number must be a positive integer" >&2
            exit 1
          fi
          source_version=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          expected="$RELEASE_BUILD_NAME+$RELEASE_BUILD_NUMBER"
          if [ "$source_version" != "$expected" ]; then
            echo "pubspec version $source_version does not match release input $expected" >&2
            exit 1
          fi
          test -f docs/PRIVACY-POLICY.md
          test -f docs/STORE-RELEASE-1.0.md
          test -f docs/STORE-METADATA.md
          test -f docs/SECURE-STORAGE-MIGRATION-1.0.md

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Enforce App Store toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          flutter --version
          xcode_major=$(xcodebuild -version | awk 'NR==1 {split($2,v,"."); print v[1]}')
          sdk_major=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
          if [ "$xcode_major" -lt 26 ]; then
            echo "App Store Connect requires Xcode 26 or later" >&2
            exit 1
          fi
          if [ "$sdk_major" -lt 26 ]; then
            echo "App Store Connect requires the iOS 26 SDK or later" >&2
            exit 1
          fi

      - name: Validate required secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_BASE64 \
            BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 \
            KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Install signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          case "$PROFILE_APP_ID" in
            *.de.wachbuch.wachbuchMobile) ;;
            *)
              echo "Provisioning profile does not match de.wachbuch.wachbuchMobile" >&2
              exit 1
              ;;
          esac
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          echo -n "$ASC_PRIVATE_KEY_BASE64" | base64 -D \
            -o "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Resolve dependencies and verify source
        run: |
          set -euo pipefail
          flutter pub get
          git diff --exit-code -- pubspec.lock
          flutter gen-l10n
          flutter analyze
          flutter test

      - name: Create signed archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --build-name "$RELEASE_BUILD_NAME" \
            --build-number "$RELEASE_BUILD_NUMBER"

          test -f ios/Runner.xcworkspace/contents.xcworkspacedata
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Wachbuch.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER=de.wachbuch.wachbuchMobile \
            MARKETING_VERSION="$RELEASE_BUILD_NAME" \
            CURRENT_PROJECT_VERSION="$RELEASE_BUILD_NUMBER" \
            FLUTTER_BUILD_NAME="$RELEASE_BUILD_NAME" \
            FLUTTER_BUILD_NUMBER="$RELEASE_BUILD_NUMBER" \
            archive

      - name: Audit archive metadata and privacy manifests
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Wachbuch.xcarchive/Products/Applications/Runner.app"
          test -d "$APP"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          encryption=$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP/Info.plist" | tr '[:upper:]' '[:lower:]')
          test "$bundle_id" = "de.wachbuch.wachbuchMobile"
          test "$version" = "$RELEASE_BUILD_NAME"
          test "$build" = "$RELEASE_BUILD_NUMBER"
          case "$encryption" in
            false|no|0) ;;
            *) echo "Unexpected ITSAppUsesNonExemptEncryption value: $encryption" >&2; exit 1 ;;
          esac

          manifest_count=0
          while IFS= read -r -d '' manifest; do
            plutil -lint "$manifest"
            manifest_count=$((manifest_count + 1))
          done < <(find "$APP" -name 'PrivacyInfo.xcprivacy' -type f -print0)
          echo "Validated $manifest_count bundled privacy manifest(s)."
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy \
            -c "Add :teamID string $APPLE_TEAM_ID" \
            "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy \
            -c "Add :provisioningProfiles:de.wachbuch.wachbuchMobile string $PROFILE_NAME" \
            "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Wachbuch.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Validate and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH=$(find "$RUNNER_TEMP/ipa" -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA was exported" >&2
            exit 1
          fi

          xcrun altool --validate-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove temporary signing material
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/build_profile.mobileprovision"
          rm -f "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          rm -f "$RUNNER_TEMP/app-signing.keychain-db"
