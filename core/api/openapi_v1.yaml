openapi: 3.0.3
info:
  title: Wachbuch API
  description: |
    Versionierte JSON-API für selbst gehostetes Wachbuch.
    Widerrufbare App-Tokens (`wb_…`) und stationsbezogene Rechte.
    Wachalltag umfasst Schichtübergaben, Mängel, Fahrzeug-/Gerätestatus,
    Checklisten, Schlüssel-/Pool-Geräte, Quittierungen und leichte Auswertung.
    Patienten-, Einsatz-, Alarmierungs- und Vorgangsdaten sind ausdrücklich
    nicht Teil dieser API.
  version: "1.2.2"
servers:
  - url: /api/v1
    description: Relative to the Wachbuch origin
security:
  - TokenAuth: []
paths:
  /:
    get:
      summary: API discovery and capabilities
      security: []
      responses:
        "200": { description: Discovery document }
  /openapi.yaml:
    get:
      summary: This OpenAPI schema
      security: []
      responses:
        "200": { description: OpenAPI YAML }
  /token/:
    post:
      summary: Obtain API token using username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                label: { type: string, maxLength: 120 }
      responses:
        "200": { description: Token created and shown once }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      summary: Revoke the presented API token
      responses:
        "200": { description: Token deactivated }
        "401": { $ref: "#/components/responses/Error" }
  /anmeldung/:
    post:
      summary: German alias for /token/
      security: []
      responses:
        "200": { description: Token created and shown once }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      summary: German alias for DELETE /token/
      responses:
        "200": { description: Token deactivated }
        "401": { $ref: "#/components/responses/Error" }
  /me/:
    get:
      summary: Current user, membership, station modules and Wachalltag capabilities
      responses:
        "200": { description: Profile payload }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /status/:
    get:
      summary: Lightweight auth/membership status
      security: []
      responses:
        "200": { description: Status payload }
  /uebersicht/:
    get:
      summary: Dashboard overview including Wachalltag counters
      responses:
        "200": { description: Overview payload }
        "403": { $ref: "#/components/responses/Error" }
  /handovers/:
    get:
      summary: Active handovers
      responses:
        "200":
          description: Handover list (results are Handover objects without detail fields)
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Handover" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create handover
      description: >-
        Optional paper backfill (0.28): is_paper_backfill true plus occurred_at (event time
        from the paper sheet, not in the future, at most 365 days ago, truncated to the minute).
        occurred_at is ignored and stored as null without the flag. occurred_at must be a string
        or null and is_paper_backfill a boolean; other JSON types give 422 with the field in
        fields. A backfill sends no Web-Push. The Wachenterminal service account cannot create
        a backfill (422).
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HandoverWrite" }
      responses:
        "201": { description: Handover created }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /handovers/{id}/:
    get:
      summary: Handover detail
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200":
          description: Handover detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Handover" }
        "404": { $ref: "#/components/responses/Error" }
  /handovers/{id}/status/:
    post:
      summary: Set handover status
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Handover updated }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /handovers/{id}/acks/:
    get:
      summary: List acknowledgements for a handover
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200":
          description: Acknowledgement list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/HandoverAck" }
        "404": { $ref: "#/components/responses/Error" }
  /handovers/{id}/ack/:
    post:
      summary: Acknowledge a handover; idempotent per user
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Existing acknowledgement }
        "201": { description: Acknowledgement created }
        "404": { $ref: "#/components/responses/Error" }
  /defects/:
    get:
      summary: List station defects
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: priority, schema: { type: string } }
        - { in: query, name: overdue, schema: { type: boolean } }
        - { in: query, name: active, schema: { type: boolean }, description: "Only defects that are not done" }
        - in: query
          name: asset
          schema: { type: string }
          description: >-
            Exact reference match, never a substring: a reference key (vehicle:<id>, device:<id>,
            asset:<id>), a vehicle or device slug, an asset id, or the reference text compared
            case-insensitively with collapsed whitespace. Alias: asset_ref.
      responses:
        "200":
          description: Defect list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  count: { type: integer }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Defect" }
    post:
      summary: Create a defect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefectWrite" }
      responses:
        "201": { description: Defect created }
        "422": { $ref: "#/components/responses/Error" }
  /defects/{id}/:
    get:
      summary: Defect detail including events and attachment metadata
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Defect detail }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Update owner, due date, priority or descriptive fields
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefectWrite" }
      responses:
        "200": { description: Defect updated }
        "422": { $ref: "#/components/responses/Error" }
  /defects/{id}/status/:
    post:
      summary: Change defect status; closing requires shift lead/admin
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, in_progress, waiting, done] }
      responses:
        "200": { description: Defect updated }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /defects/{id}/attachments/:
    get:
      summary: List image attachments for a defect
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Attachment metadata list }
    post:
      summary: Upload JPEG, PNG or WebP up to 2 MiB each; max 8 images and 12 MiB total per defect
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_type, data_base64]
              properties:
                filename: { type: string, maxLength: 180 }
                content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
                data_base64: { type: string, format: byte }
      responses:
        "201": { description: Attachment created }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /attachments/{id}/:
    get:
      summary: Download an authenticated defect image
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Image bytes }
        "404": { $ref: "#/components/responses/Error" }
  /assets/:
    get:
      summary: Vehicle/device status board
      responses:
        "200": { description: Asset list }
    post:
      summary: Create an asset (shift lead/admin)
      responses:
        "201": { description: Asset created }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /assets/{asset_id}/status/:
    post:
      summary: Change asset status (shift lead/admin)
      parameters:
        - in: path
          name: asset_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Asset updated }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /inventory/:
    get:
      summary: List keys and pooled devices
      responses:
        "200": { description: Inventory list }
    post:
      summary: Create inventory item (shift lead/admin)
      responses:
        "201": { description: Inventory item created }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /inventory/{item_id}/checkout/:
    post:
      summary: Check out an item to the current user
      parameters:
        - in: path
          name: item_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Item state }
        "409": { $ref: "#/components/responses/Error" }
  /inventory/{item_id}/checkin/:
    post:
      summary: Return an item
      parameters:
        - in: path
          name: item_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Item state }
        "403": { $ref: "#/components/responses/Error" }
  /kalender/:
    get:
      summary: Upcoming station calendar events
      responses:
        "200": { description: Calendar list }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Create calendar event
      responses:
        "201": { description: Calendar event created }
  /kaffeekasse/:
    get:
      summary: Coffee fund – own monthly-fee status (own); station ledger only for the treasurer
      responses:
        "200": { description: Coffee ledger }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Append coffee ledger entry (treasurer only; optional payment method)
      responses:
        "201": { description: Coffee entry created }
  /kaffeekasse/bezahlt/:
    post:
      summary: Report own payment (any member; method cash/transfer/paypal/wero, amount_euros, note)
      responses:
        "201": { description: "Payment recorded; returns own status and payment ways. An identical report by the same person within 60 s (double tap, client retry) is not booked again: the response carries the first entry's id and duplicate: true." }
        "422": { $ref: "#/components/responses/Error" }
  /checklisten/:
    get:
      summary: Active checklists with items, last final run, open draft and recurring schedule state
      description: |
        `items` keeps the item texts for older apps. `item_details` carries the item ids that
        `item_results` must use, plus required flag, unit and limits. `last_completed_at` is the
        time of the newest final run (the event time for a paper backfill); drafts never count.
        `draft` is the station's shared draft of this checklist (or null).
      responses:
        "200":
          description: Checklist list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Checklist" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /checklisten/{id}/erledigt/:
    post:
      summary: Finalize a checklist run (or save the draft with is_draft true)
      description: |
        One shared validation for web and app. A final run needs item_results for the checklist's
        items (missing or empty results are a 400), every required item rated, a reason for `na`,
        and a value for measurement items rated `ok` or `not_ok`. On a final run a value outside
        the limits turns the item into `not_ok` with an automatic reason; a draft keeps the status
        and reason as sent. NaN, Infinity, values beyond
        999999.99, unknown item ids, non-object entries and non-boolean flags are a 400.
        A final run is stored once (append-only), deletes the shared draft, creates a defect for
        each `not_ok` item unless an open defect of the same checklist item exists (then the
        result links to it, see `defects_linked`), and advances the recurring due date. A paper
        backfill advances it from its `occurred_at`, so `due_next` may stay in the past and
        `overdue` stays true for later cycles without a run; a backfill older than the current
        cycle leaves it unchanged. The terminal service account cannot finalize checklists with
        `requires_personal_login` and cannot backfill.
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistRunWrite" }
      responses:
        "200": { description: "Draft saved (is_draft true)", content: { application/json: { schema: { $ref: "#/components/schemas/ChecklistDraftResponse" } } } }
        "201": { description: Final run recorded, content: { application/json: { schema: { $ref: "#/components/schemas/ChecklistRun" } } } }
        "400": { description: "validation_error; `errors` lists every problem", content: { application/json: { schema: { $ref: "#/components/schemas/ValidationErrorResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /checklisten/{id}/abschluss/:
    post:
      summary: Alias for /erledigt/
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistRunWrite" }
      responses:
        "200": { description: "Draft saved (is_draft true)" }
        "201": { description: Final run recorded }
        "400": { $ref: "#/components/responses/Error" }
  /checklisten/{id}/zwischenstand/:
    get:
      summary: Read the station's shared draft of a checklist (null if none)
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Draft or null, content: { application/json: { schema: { $ref: "#/components/schemas/ChecklistDraftResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Save (replace) the shared draft; same input rules as a run, without the completeness and limit checks
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item_results: { $ref: "#/components/schemas/ChecklistItemResults" }
                note: { type: string, maxLength: 300 }
      responses:
        "200": { description: Draft saved, content: { application/json: { schema: { $ref: "#/components/schemas/ChecklistDraftResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Same as POST
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Draft saved }
  /checklisten/{id}/schedule/:
    get:
      summary: Read recurring checklist schedule
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Schedule }
    put:
      summary: Set recurring checklist schedule (shift lead/admin)
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Schedule updated }
    delete:
      summary: Remove recurring schedule (shift lead/admin)
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Schedule removed }
  /benachrichtigungen/:
    get:
      summary: Own notification inbox (unread first, at most 50 unread and 20 read)
      description: |
        Personal notices (UserNotification) of the caller at the own station.
        Scope read:me. Optional `kinds` limits the result to the given kinds so
        the app only polls what it renders; unknown kinds are ignored.
      parameters:
        - in: query
          name: kinds
          required: false
          description: Comma-separated kinds, e.g. vehicle_ready,coffee_due
          schema:
            type: string
            example: vehicle_ready,coffee_due,deadline_due,sop_due
      responses:
        "200":
          description: "Notifications: id, kind, key, title, body, url, created_at, read"
        "403": { $ref: "#/components/responses/Error" }
  /benachrichtigungen/gelesen/:
    post:
      summary: Mark all unread notifications of the given kinds as read
      description: |
        Scope read:me. Body `{"kinds": ["deadline_due", "sop_due"]}` or query
        `?kinds=deadline_due,sop_due`. Without a known kind the request is
        refused (no accidental "mark everything read").
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                kinds:
                  type: array
                  items: { type: string }
      responses:
        "200": { description: "ok, kinds, marked (number of notifications marked read)" }
        "400": { $ref: "#/components/responses/Error" }
  /benachrichtigungen/{id}/gelesen/:
    post:
      summary: Mark one own notification as read
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Notification marked read }
        "404": { $ref: "#/components/responses/Error" }
  /dienstanweisungen/:
    get:
      summary: Work instructions the caller must read and acknowledge
      description: |
        Scope read:me. Only work instructions in force with a released text
        that require acknowledgement and whose target group (role and
        function) includes the caller. Each entry: id, doc_number, title,
        revision {id, version}, ack_due_date, overdue, acknowledged,
        acknowledged_at, in_target_group, url (web page of the document). No
        names of other people and no quota. Auditors and the station terminal
        service account get 403.
      parameters:
        - in: query
          name: offen
          required: false
          description: "1 = only work instructions not yet acknowledged in the current version"
          schema: { type: string, enum: ["1", "0"] }
      responses:
        "200": { description: List of own reading obligations }
        "403": { $ref: "#/components/responses/Error" }
  /dienstanweisungen/{id}/quittieren/:
    post:
      summary: Acknowledge the current version of a work instruction
      description: |
        Same rules as the web: own account of a content role (never the
        station terminal), work instruction in force, released text. Outside
        the target group the acknowledgement is voluntary and not counted in
        the quota. Stores person, version and time only (no IP address, no
        user agent). Idempotent. Optional body `{"revision": <id>}`: if a newer
        version exists, 409 is returned so the app can show the new text first.
        `revision` must be an integer (or a string of ASCII digits); floats,
        booleans and other values return 400 validation_error.
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                revision: { type: integer }
      responses:
        "201": { description: Acknowledgement recorded (created true) }
        "200": { description: Already acknowledged (created false) }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /reports/:
    get:
      summary: Lightweight station Wachalltag report
      responses:
        "200": { description: Aggregated counts and readiness percentage }
        "201":
          description: Completion recorded
  /check-update/:
    get:
      summary: Client update check (public, rate-limited)
      description: |
        Returns the latest active app version for a platform with changelog,
        download URL and force-update flag. Public endpoint, rate limited per IP.
      security: []
      parameters:
        - in: query
          name: current_version
          required: false
          schema: { type: string }
        - in: query
          name: platform
          required: false
          schema: { type: string, enum: [web, android, ios] }
      responses:
        "200":
          description: Update information (has_update false when no active version exists)
        "429":
          description: Rate limit exceeded
  /update/:
    get:
      summary: English alias for /check-update/
      security: []
      parameters:
        - in: query
          name: current_version
          required: false
          schema: { type: string }
        - in: query
          name: platform
          required: false
          schema: { type: string, enum: [web, android, ios] }
      responses:
        "200":
          description: Update information
        "429":
          description: Rate limit exceeded

components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Format: Token <secret> or Bearer <secret>"
  parameters:
    IntegerId:
      in: path
      name: id
      required: true
      schema: { type: integer }
  responses:
    Error:
      description: Canonical API error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message, correlation_id]
          properties:
            code:
              type: string
              enum: [validation_error, auth_required, forbidden, mfa_required, mfa_setup_required, not_found, conflict, payload_too_large, unsupported_media_type, rate_limit, server_error]
            message: { type: string }
            correlation_id: { type: string }
    ValidationErrorResponse:
      allOf:
        - { $ref: "#/components/schemas/ErrorResponse" }
        - type: object
          properties:
            errors: { type: array, items: { type: string } }
    ChecklistItem:
      type: object
      properties:
        id: { type: integer, description: "Key for item_results" }
        text: { type: string }
        position: { type: integer }
        required: { type: boolean }
        unit: { type: string }
        min: { type: string, nullable: true, description: "Decimal as string, e.g. \"2.00\"; 0 is a real limit" }
        max: { type: string, nullable: true }
        measurement: { type: boolean, description: "Unit or limit set: ok/not_ok need a value" }
    Checklist:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        items: { type: array, items: { type: string }, description: "Item texts (older apps)" }
        item_details: { type: array, items: { $ref: "#/components/schemas/ChecklistItem" } }
        requires_personal_login: { type: boolean }
        last_completed_at: { type: string, format: date-time, nullable: true }
        last_completed_by: { type: string, nullable: true }
        last_completed_paper_backfill: { type: boolean }
        draft: { allOf: [{ $ref: "#/components/schemas/ChecklistDraft" }], nullable: true }
        interval: { type: string }
        due_next: { type: string, format: date-time, nullable: true }
        overdue: { type: boolean }
    ChecklistItemResult:
      type: object
      properties:
        status: { type: string, enum: ["", ok, not_ok, na] }
        value: { oneOf: [{ type: number }, { type: string }], nullable: true, description: "Measurement; a string may use a decimal comma" }
        reason: { type: string, maxLength: 500 }
    ChecklistItemResults:
      type: object
      description: "Object keyed by item id (from item_details)"
      additionalProperties: { $ref: "#/components/schemas/ChecklistItemResult" }
    ChecklistStoredResult:
      allOf:
        - { $ref: "#/components/schemas/ChecklistItemResult" }
        - type: object
          description: "Stored with a copy of the item at the time of the run"
          properties:
            text: { type: string }
            unit: { type: string }
            min: { type: string, nullable: true }
            max: { type: string, nullable: true }
            required: { type: boolean }
            position: { type: integer }
            defect_id: { type: integer, nullable: true }
            defect_linked: { type: boolean, description: "true: links to an open defect that already existed" }
    ChecklistRunWrite:
      type: object
      properties:
        item_results: { $ref: "#/components/schemas/ChecklistItemResults" }
        note: { type: string, maxLength: 300 }
        is_draft: { type: boolean, description: "true/false (also 1/0, \"true\"/\"false\"); anything else is a 400" }
        is_paper_backfill: { type: boolean }
        occurred_at: { type: string, format: date-time, description: "Event time of a paper backfill: not in the future, at most 365 days ago" }
    ChecklistDraft:
      type: object
      properties:
        id: { type: integer }
        note: { type: string }
        item_results: { type: object, additionalProperties: { $ref: "#/components/schemas/ChecklistStoredResult" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
    ChecklistDraftResponse:
      type: object
      properties:
        ok: { type: boolean }
        is_draft: { type: boolean }
        checklist: { type: integer }
        draft: { allOf: [{ $ref: "#/components/schemas/ChecklistDraft" }], nullable: true }
    ChecklistRun:
      type: object
      properties:
        ok: { type: boolean }
        id: { type: integer }
        checklist: { type: integer }
        is_draft: { type: boolean, enum: [false] }
        item_results: { type: object, additionalProperties: { $ref: "#/components/schemas/ChecklistStoredResult" } }
        defects_created: { type: array, items: { type: integer } }
        defects_linked: { type: array, items: { type: integer } }
        created_at: { type: string, format: date-time }
        occurred_at: { type: string, format: date-time, nullable: true }
        is_paper_backfill: { type: boolean }
        interval: { type: string }
        due_next: { type: string, format: date-time, nullable: true }
        overdue: { type: boolean }
    Defect:
      allOf:
        - { $ref: "#/components/schemas/DefectWrite" }
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id: { type: integer }
            status: { type: string, enum: [open, in_progress, waiting, done] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            attachment_count: { type: integer }
    DefectWrite:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
          description: >-
            Optional since 0.28. When empty, the server builds "<category>: <asset_ref>" in the station
            language (as the web defect form does).
        description: { type: string, maxLength: 3000 }
        asset_ref: { type: string, maxLength: 160 }
        priority: { type: string, enum: [normal, important, urgent] }
        owner: { type: string, description: Username of an active station member }
        due_at: { type: string, format: date-time, nullable: true }
        category: { type: string, enum: [vehicle, material, safety, facility, key, device, task] }
    Handover:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        category: { type: string, enum: [station, vehicle, material, task, safety] }
        priority: { type: string, enum: [normal, important, urgent] }
        status: { type: string, enum: [open, in_progress, done] }
        updated_at: { type: string, format: date-time }
        is_paper_backfill: { type: boolean, description: "Nachtrag vom Papierbogen (0.28)" }
        occurred_at: { type: string, format: date-time, nullable: true, description: "Event time from the paper sheet; null unless is_paper_backfill" }
        details: { type: string, description: detail only }
        created_at: { type: string, format: date-time, description: "detail only; for a backfill the entry time" }
        version: { type: integer, description: detail only }
    HandoverWrite:
      type: object
      required: [category, title, details]
      properties:
        category: { type: string, enum: [station, vehicle, material, task, safety] }
        priority: { type: string, enum: [normal, important, urgent] }
        title: { type: string, maxLength: 160 }
        details: { type: string, maxLength: 3000 }
        is_paper_backfill: { type: boolean }
        occurred_at: { type: string, format: date-time, nullable: true, description: "Required with is_paper_backfill: not in the future, at most 365 days ago; truncated to the minute" }
    HandoverAck:
      type: object
      required: [handover_id, by, at]
      properties:
        handover_id: { type: integer }
        by: { type: string }
        at: { type: string, format: date-time }
      description: "Format: Token <secret> or Bearer <secret>"
